AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SimXSphere Serverless Cloud Architecture — 100% Class A Always-Free Architecture.
  Zero Out-of-Pocket Cost: Lambda Function URLs (Always Free), DynamoDB Provisioned 5 RCU/WCU (Always Free), Cognito (50k MAUs Always Free).
  Strictly Prohibited: S3 (paid after 12 mo), API Gateway (paid after 12 mo), EC2, RDS, NAT Gateway, CloudFront, Route53, WAF.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

Parameters:
  AppClientOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed origin for CORS headers

Resources:
  # -------------------------------------------------------------
  # 1. Authentication: AWS Cognito User Pool (50,000 MAUs Always Free)
  # -------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # -------------------------------------------------------------
  # 2. Serverless Compute: AWS Lambda + Function URL (1M requests & 3.2M sec compute Always Free)
  # Eliminates Amazon API Gateway (which charges after 12 months)
  # -------------------------------------------------------------
  SimXSphereApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: api.handler
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AppClientOrigin
          AllowHeaders:
            - Authorization
            - Content-Type
          AllowMethods:
            - GET
            - POST
            - DELETE
            - OPTIONS
          MaxAge: 600
      Environment:
        Variables:
          TABLE_NAME: !Ref PackagesTable
          USER_POOL_ID: !Ref UserPool
          APP_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt PackagesTable.Arn

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SimXSphereApiFunction}'
      RetentionInDays: 7

  # -------------------------------------------------------------
  # 3. Metadata & Payload: Amazon DynamoDB (25 GB Storage & 25 RCU/WCU Always Free)
  # Setting 5 RCU / 5 WCU uses only 20% of the verified Always Free allowance.
  # Small .simxpack packages (2-50 KB) are stored directly as DynamoDB items, eliminating Amazon S3.
  # -------------------------------------------------------------
  PackagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-packages'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

Outputs:
  ApiFunctionUrl:
    Description: Lambda Function URL Endpoint (Zero Cost, No API Gateway surcharge)
    Value: !GetAtt SimXSphereApiFunctionUrl.FunctionUrl
  UserPoolId:
    Description: Cognito User Pool ID (50,000 MAUs Always Free)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  PackagesTableName:
    Description: DynamoDB Provisioned Table (Always Free 25 RCU/WCU)
    Value: !Ref PackagesTable
